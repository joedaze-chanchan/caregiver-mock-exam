<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>요양보호사 모의고사</title>
<meta name="theme-color" content="#0d6b66">
<style>
:root{--bg:#eef3f2;--paper:#fff;--ink:#1c2a29;--muted:#5b6d6b;--line:#cfdcda;--accent:#0d6b66;--accent-ink:#fff;--bad:#b3261e}
@media (prefers-color-scheme: dark){:root{--bg:#121a19;--paper:#1b2625;--ink:#e7efee;--muted:#9db0ad;--line:#304240;--accent:#4fc2b8;--accent-ink:#0b1b1a;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:20px;line-height:1.6}
main{max-width:440px;margin:0 auto;padding:12vh 16px 48px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px 22px}
h1{font-size:1.5em;margin:0 0 .3em;line-height:1.3}
p{margin:0 0 1em;color:var(--muted)}
label{display:block;font-weight:700;margin-bottom:.4em}
input{width:100%;font:inherit;font-size:1.6em;letter-spacing:.3em;text-align:center;padding:.4em;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus{outline:3px solid var(--accent);outline-offset:1px}
button{width:100%;margin-top:16px;font:inherit;font-size:1.15em;font-weight:700;padding:.8em;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:1.6em;margin:.8em 0 0;color:var(--bad);font-weight:700;text-align:center}
</style>
</head>
<body>
<main>
  <form class="card" id="f" hidden>
    <h1>요양보호사 모의고사</h1>
    <p>비밀번호를 한 번만 넣으면, 이 기기에서는 다음부터 바로 열립니다.</p>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" required>
    <button id="go">들어가기</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
</main>

const KEY_NAME = 'ybs_unlock';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function keyFromPassword(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256'}, base, 256);
}
async function open(raw){
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(CT));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close() }
async function start(){
  let saved = null;
  try{ saved = localStorage.getItem(KEY_NAME) }catch(e){}
  if(saved){
    try{ show(await open(b64(saved))); return }catch(e){ try{ localStorage.removeItem(KEY_NAME) }catch(_){} }
  }
  const f = document.getElementById('f'), pw = document.getElementById('pw'), msg = document.getElementById('msg'), go = document.getElementById('go');
  f.hidden = false; pw.focus();
  f.addEventListener('submit', async ev => {
    ev.preventDefault();
    go.disabled = true; msg.textContent = ''; go.textContent = '여는 중…';
    try{
      const raw = await keyFromPassword(pw.value.trim());
      const html = await open(raw);
      try{ localStorage.setItem(KEY_NAME, toB64(raw)) }catch(e){}
      show(html);
    }catch(e){
      msg.textContent = '비밀번호가 맞지 않습니다. 다시 넣어 주세요.';
      go.disabled = false; go.textContent = '들어가기'; pw.select();
    }
  });
}
start();
})();
